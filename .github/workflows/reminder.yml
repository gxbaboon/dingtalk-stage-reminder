name: 巡检提醒定时任务

on:
  schedule:
    # 北京时间 06:00 → UTC 22:00（提前触发，补偿GitHub延迟约2-3小时）
    - cron: '30 0 * * *'
    # 北京时间 14:00 → UTC 06:00（提前触发，补偿GitHub延迟约3-4小时）
    - cron: '50 9 * * *'
  workflow_dispatch:
    inputs:
      type:
        description: '提醒类型'
        required: true
        default: 'morning'
        type: choice
        options:
          - morning
          - evening

jobs:
  morning:
    if: github.event.schedule == '0 22 * * *' || (github.event_name == 'workflow_dispatch' && github.event.inputs.type == 'morning')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 执行巡检提醒
        env:
          TZ: Asia/Shanghai
        run: python send_reminder.py

  evening:
    if: github.event.schedule == '0 6 * * *' || (github.event_name == 'workflow_dispatch' && github.event.inputs.type == 'evening')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 执行演出前提醒
        env:
          TZ: Asia/Shanghai
        run: TYPE=evening python send_reminder.py
